paths:
  /api/products:
    post:
      tags:
        - Products
      summary: Criar novo produto
      description: Apenas admins podem criar produtos
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - price
              properties:
                name:
                  type: string
                  example: Notebook Dell
                description:
                  type: string
                  example: Notebook Dell Inspiron 15
                price:
                  type: number
                  format: float
                  example: 3500.00
                stock:
                  type: integer
                  example: 10
      responses:
        '201':
          description: Produto criado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Product'
        '403':
          description: Apenas admins podem criar produtos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags:
        - Products
      summary: Listar todos os produtos
      description: Qualquer usuário autenticado pode listar produtos
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Número da página
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Quantidade de itens por página
        - in: query
          name: name
          schema:
            type: string
            example: 'notebook'
          description: Filtrar por nome do produto (busca parcial)
        - in: query
          name: minPrice
          schema:
            type: number
            minimum: 0
            example: 100
          description: Preço mínimo
        - in: query
          name: maxPrice
          schema:
            type: number
            minimum: 0
            example: 500
          description: Preço máximo
        - in: query
          name: inStock
          schema:
            type: boolean
            example: true
          description: Filtrar produtos em estoque (true) ou sem estoque (false)
      responses:
        '200':
          description: Lista de produtos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                        example: 1
                      limit:
                        type: integer
                        example: 10
                      total:
                        type: integer
                        example: 100
                      totalPages:
                        type: integer
                        example: 10

  /api/products/{id}:
    get:
      tags:
        - Products
      summary: Buscar produto por ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Produto encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
        '404':
          description: Produto não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Products
      summary: Atualizar produto
      description: Apenas admins podem atualizar produtos
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                  format: float
                stock:
                  type: integer
      responses:
        '200':
          description: Produto atualizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Product'
        '403':
          description: Apenas admins podem atualizar produtos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Products
      summary: Deletar produto
      description: Apenas admins podem deletar produtos
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Produto deletado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          description: Apenas admins podem deletar produtos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
