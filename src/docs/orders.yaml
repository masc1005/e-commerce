paths:
  /api/orders:
    post:
      tags:
        - Orders
      summary: Criar novo pedido
      description: Cliente cria pedido para si mesmo. Admin pode criar para qualquer cliente. Estoque é reduzido automaticamente.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - clientId
                - items
              properties:
                clientId:
                  type: string
                  format: uuid
                  example: 123e4567-e89b-12d3-a456-426614174000
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - productId
                      - quantity
                    properties:
                      productId:
                        type: string
                        format: uuid
                        example: 987e6543-e21b-32d1-a654-426614174999
                      quantity:
                        type: integer
                        minimum: 1
                        example: 2
      responses:
        '201':
          description: Pedido criado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Order'
        '400':
          description: Estoque insuficiente ou dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags:
        - Orders
      summary: Listar pedidos
      description: Admin lista todos os pedidos. Cliente vê apenas seus próprios pedidos.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Número da página
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Quantidade de itens por página
        - in: query
          name: clientId
          schema:
            type: string
            format: uuid
            example: '123e4567-e89b-12d3-a456-426614174000'
          description: Filtrar por cliente (apenas para admin)
        - in: query
          name: startDate
          schema:
            type: string
            format: date
            example: '2026-01-01'
          description: Data inicial do período (formato YYYY-MM-DD)
        - in: query
          name: endDate
          schema:
            type: string
            format: date
            example: '2026-01-31'
          description: Data final do período (formato YYYY-MM-DD)
      responses:
        '200':
          description: Lista de pedidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                        example: 1
                      limit:
                        type: integer
                        example: 10
                      total:
                        type: integer
                        example: 30
                      totalPages:
                        type: integer
                        example: 3

  /api/orders/report/csv:
    get:
      tags:
        - Orders
      summary: Gerar relatório CSV de pedidos
      description: Apenas admins podem gerar relatórios. Retorna um arquivo CSV para download com os pedidos filtrados por período.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: startDate
          schema:
            type: string
            format: date
            example: '2026-01-01'
          description: Data inicial do período (formato YYYY-MM-DD)
        - in: query
          name: endDate
          schema:
            type: string
            format: date
            example: '2026-01-31'
          description: Data final do período (formato YYYY-MM-DD)
      responses:
        '200':
          description: Arquivo CSV gerado com sucesso
          content:
            text/csv:
              schema:
                type: string
                example: |
                  ID,Cliente ID,Status,Data do Pedido,Total,Criado em,Atualizado em
                  123e4567-e89b-12d3-a456-426614174000,987e6543-e21b-32d1-a654-426614174999,received,2026-01-15T10:00:00Z,150.00,2026-01-15T10:00:00Z,2026-01-15T10:00:00Z
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="orders-report-2026-01-24.csv"'
        '403':
          description: Apenas admins podem gerar relatórios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/orders/{id}:
    get:
      tags:
        - Orders
      summary: Buscar pedido por ID
      description: Admin pode ver qualquer pedido. Cliente vê apenas seus próprios pedidos.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Order'
                      - type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/OrderItem'
        '404':
          description: Pedido não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sem permissão para visualizar este pedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Orders
      summary: Deletar pedido
      description: Apenas admins podem deletar pedidos
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pedido deletado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          description: Apenas admins podem deletar pedidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/orders/{id}/status:
    patch:
      tags:
        - Orders
      summary: Atualizar status do pedido
      description: Apenas admins podem atualizar o status dos pedidos
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [received, preparing, dispatched, delivered]
                  example: preparing
      responses:
        '200':
          description: Status atualizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Order'
        '403':
          description: Apenas admins podem atualizar status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
